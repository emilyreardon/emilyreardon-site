    /* Header */
    .site-header {

      justify-content: space-between;
      align-items: center;

    .tagline {

      margin-top: 0.2rem;
    }


    /* Nav */
    .nav-container { display: flex; }


    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.8rem;
      margin: 0;
      padding: 0;
    }


    .nav-links a {
      visibility: hidden;
      font-weight: 300;
      text-decoration: none;
      color: #000;
      position: relative;
    }


    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      left: 0;
      bottom: -3px;
      background-color: #000;
      transition: width 0.25s ease;
    }


    .nav-links a:hover::after { width: 100%; }
    .nav-links a.current::after { width: 100%; }


    .hamburger {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }


    /* Name font-cycle animation */
    :root {
      --cycle-duration: 32s;
      --stagger-step: 2.5s;
    }


    .letter {
      display: inline-block;
      animation: name-font-cycle var(--cycle-duration) steps(1) infinite;
      animation-delay: calc(var(--i) * var(--stagger-step) * -1);
    }


    @keyframes name-font-cycle {
      0%   { font-family: "Fraunces", serif; }
      25%  { font-family: "Josefin Sans", sans-serif; }
      50%  { font-family: "Poiret One", cursive; }
      75%  { font-family: "Metamorphous", serif; }
      100% { font-family: "Fraunces", serif; }
    }


    /* Period dots */
    .period-dot {
      display: inline-block;
      border-radius: 50%;
      background-color: currentColor;
      vertical-align: baseline;
      line-height: 0;
      margin: 0 0.04em;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }


    .period-dot.sz-sm { width: 0.13em; height: 0.13em; }
    .period-dot.sz-md { width: 0.18em; height: 0.18em; }
    .period-dot.sz-lg { width: 0.24em; height: 0.24em; }
    .period-dot.visible { opacity: 1; }


    /* Filter bar */
    .filter-bar {
      max-width: 900px;
      margin: 1.6rem auto 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
      display: flex;
      gap: 1.4rem;
      border-bottom: 1px solid #000;
      padding-bottom: 0;
    }


    .filter-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.35rem 0 0.45rem 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      color: #555;
      transition: color 0.18s ease, border-color 0.18s ease;
      margin-bottom: -1px;
    }


    .filter-btn:hover { color: #000; }


    .filter-btn.active {
      color: #000;
      border-bottom-color: #000;
    }


    /* Main */
    .main-content {
      margin-top: 2rem;
      margin-bottom: 3rem;
    }


    /* Project cards */
    .project-card {
      display: block;
      padding: 2rem 0;
      border-bottom: 1px solid #000;
    }


    .project-card:first-child { border-top: 1px solid #000; }


    .project-card.hidden { display: none; }


    .project-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 0 0 0.35rem 0;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-align: left;
    }


    .project-image-wrap { width: 100%; margin: 0; }


    .project-image-wrap + .project-image-wrap { margin-top: 0.75rem; }


    .project-image-pair {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }


    .project-image-pair-col {
      min-width: 0;
    }


    .project-image-pair-col img,
    .project-image-pair-col video {
      display: block;
      width: 100%;
      height: auto;
    }


    .project-image-pair-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }


    .project-image-pair + .project-image-wrap,
    .project-image-wrap + .project-image-pair {
      margin-top: 0.75rem;
    }


    .project-image {
      width: 100%;
      height: auto;
      display: block;
    }


    .project-image-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #999;
      letter-spacing: 0.05em;
    }


    /* GIF grid */
    .gif-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.5rem;
      margin: 0;
    }


    .gif-grid-cell {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }


    .gif-grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    .gif-grid-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.05em;
    }


    .project-byline {

      margin: 0.45rem 0 0 0;

    }


    .project-body-wrap {

    .project-label {

</style>

  <script>
    (function() {
      var fonts = ["'Josefin Sans', sans-serif", "'Poiret One', sans-serif", "'Fraunces', serif"];
      var styles = ["normal", "normal", "italic"];
      var stored;
      try { stored = JSON.parse(sessionStorage.getItem('emNav9')); } catch(e) {}
      if (!stored) stored = {};
      var changed = false;
      document.querySelectorAll('.nav-links a').forEach(function(el) {
        var key = el.getAttribute('href') || el.textContent.trim();
        var isPDF = key.indexOf('.pdf') !== -1;
        if (!stored[key]) {
          var text = el.textContent.trim().replace(/\.$/, '');
          var chars = [];
          for (var i = 0; i < text.length; i++) chars.push(Math.floor(Math.random() * fonts.length));
          var periods = [];
          if (!isPDF) {
            var numPeriods = Math.random() < 0.1 ? 0 : (Math.random() < 0.4 ? 1 : (Math.random() < 0.6 ? 2 : 3));
            var tries = 0;
            while (periods.length < numPeriods && tries < 30) {
              var pos = Math.floor(Math.random() * (text.length - 1));
              if (periods.indexOf(pos) === -1) periods.push(pos);
              tries++;
            }
          }
          stored[key] = { chars: chars, periods: periods };
          changed = true;
        }
        var word = stored[key];
        var text = el.textContent.trim().replace(/\.$/, '');
        var html = '';
        for (var i = 0; i < text.length; i++) {
          var fi = word.chars[i % word.chars.length] % fonts.length;
          html += '<span style="font-family:' + fonts[fi] + ';font-style:' + styles[fi] + ';font-weight:300">' + text[i] + '</span>';
          if (word.periods.indexOf(i) !== -1) html += '<span style="font-family:' + fonts[fi] + ';font-style:' + styles[fi] + ';font-weight:300">.</span>';
        }
        el.innerHTML = html;
        el.style.visibility = 'visible';
      });
      if (changed) try { sessionStorage.setItem('emNav9', JSON.stringify(stored)); } catch(e) {}
    })();
  </script>
